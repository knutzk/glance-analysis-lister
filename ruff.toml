line-length = 88
target-version = "py313"

src = ["."]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "LOG"]
ignore = [
    # Line length is the formatter's job. What survives it is the long
    # f-strings that render Markdown, which are clearer left unsplit.
    "E501",
    # else-after-return, a matter of taste.
    "RET505",
]

[lint.isort]
# Keep "from x import (a as b, c as d)" in one statement. Without this the
# renderer's aliased page imports are split into one statement per alias.
combine-as-imports = true

[lint.per-file-ignores]
# The lambdas here are handed straight to registry.count(), which calls them
# within the same iteration, so the late binding B023 warns about cannot bite.
"analysis_lister/markdown/global_pages/ongoing.py" = ["B023"]
