<svg xmlns="http://www.w3.org/2000/svg" width="800" height="448" viewBox="0 0 800 448" role="img" aria-labelledby="title description">
  <!-- SPDX-FileCopyrightText: 2024-2026 Knut Zoch -->
  <!-- SPDX-License-Identifier: GPL-3.0-only -->
  <title id="title">GLANCE retrieval, registry construction and page rendering</title>
  <desc id="description">GLANCE requires CERN access. Refresh combines download-api, build-registry and render-group from left to right, connected by a saved API snapshot and curated registry. The flow continues down to generated Markdown pages, browser assets and a diagnostic report. Pages and assets then go right to a preview or website; the report is for review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" class="arrow-head"/>
    </marker>
  </defs>
  <style>
    svg { color-scheme: light dark; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #233846; }
    .canvas { fill: #fff; }
    .heading { font-size: 19px; font-weight: 600; }
    .body { font-size: 17px; }
    .small { font-size: 15px; fill: #526573; }
    .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: 1.2px; fill: #526573; }
    .command-name { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; }
    .frame { fill: #f5f7f8; stroke: #b4c0c7; stroke-width: 1.3; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 18px; }
    .center { text-anchor: middle; }
    .file { fill: #f8fafb; stroke: #8799a5; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .stage { fill: #f0f8f7; stroke: #229e95; stroke-width: 1.5; }
    .step { fill: #fff; stroke: #b7d8d3; stroke-width: 1; }
    .optional { fill: #f6f3fb; stroke: #baacd0; stroke-width: 1.2; }
    .output { fill: #f8fafb; stroke: #8799a5; stroke-width: 1.4; }
    .note { fill: #e4f4f2; }
    .link { fill: #087c74; }
    .connector { fill: none; stroke: #657780; stroke-width: 1.6; marker-end: url(#arrow); }
    .arrow-head { fill: #657780; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e3edf1; }
      .canvas { fill: #141b20; }
      .frame { fill: #192229; stroke: #586d79; }
      .small, .eyebrow { fill: #b5c5ce; }
      .file, .output { fill: #1d2931; stroke: #7e939f; }
      .stage { fill: #173430; stroke: #52beb2; }
      .step { fill: #1c292d; stroke: #41645f; }
      .optional { fill: #292438; stroke: #8e80a8; }
      .note { fill: #173430; }
      .link { fill: #75dbcd; }
      .connector { stroke: #a4b6bf; }
      .arrow-head { fill: #a4b6bf; }
    }
  </style>
  <rect class="canvas" width="800" height="448" rx="20"/>
  <g id="glance">
    <rect class="output" x="296" y="24" width="208" height="76" rx="18"/>
    <text class="heading center" x="400" y="55">ATLAS GLANCE</text>
    <text class="small center" x="400" y="81">CERN access</text>
  </g>
  <path id="source-to-refresh" class="connector" d="M400 100V143"/>

  <g id="refresh">
    <rect class="frame" x="16" y="144" width="768" height="154" rx="22"/>
    <text id="refresh-label" class="center" x="400" y="176"><tspan class="mono">refresh</tspan><tspan class="body"> · three steps in one</tspan></text>
    <g id="download">
      <rect class="stage" x="32" y="202" width="156" height="72" rx="20"/>
      <text class="eyebrow center" x="110" y="225">1</text>
      <text class="command-name center" x="110" y="252">download-api</text>
    </g>
    <path class="connector" d="M188 238H204"/>
    <g id="api">
      <rect class="file" x="206" y="206" width="98" height="64" rx="12"/>
      <text class="body center" x="255" y="232">API</text>
      <text class="body center" x="255" y="254">snapshot</text>
    </g>
    <path class="connector" d="M304 238H320"/>
    <g id="build">
      <rect class="stage" x="322" y="202" width="156" height="72" rx="20"/>
      <text class="eyebrow center" x="400" y="225">2</text>
      <text class="command-name center" x="400" y="252">build-registry</text>
    </g>
    <path class="connector" d="M478 238H494"/>
    <g id="curated">
      <rect class="file" x="496" y="206" width="98" height="64" rx="12"/>
      <text class="body center" x="545" y="232">Curated</text>
      <text class="body center" x="545" y="254">registry</text>
    </g>
    <path class="connector" d="M594 238H610"/>
    <g id="render">
      <rect class="stage" x="612" y="202" width="156" height="72" rx="20"/>
      <text class="eyebrow center" x="690" y="225">3</text>
      <text class="command-name center" x="690" y="252">render-group</text>
    </g>
  </g>

  <path id="refresh-to-output" class="connector" d="M400 298V341"/>
  <g id="output">
    <rect class="file" x="248" y="342" width="304" height="82" rx="12"/>
    <text class="heading center" x="400" y="374">Generated files</text>
    <text class="body center" x="400" y="402">Markdown · assets · report</text>
  </g>
  <path id="output-to-preview" class="connector" d="M552 383H594"/>
  <g id="preview">
    <rect class="output" x="596" y="342" width="172" height="82" rx="18"/>
    <text class="heading center" x="682" y="374">Preview</text>
    <text class="body center" x="682" y="402">or website</text>
  </g>
</svg>
