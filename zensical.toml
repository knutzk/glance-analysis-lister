[project]
site_name = "GLANCE analysis lister · development"
site_description = "Analysis and publication pages from ATLAS GLANCE records"
site_url = "https://knutzoch.org/glance-analysis-lister/"
repo_url = "https://github.com/knutzk/glance-analysis-lister"
# scripts/docs.py selects public inputs and preserves their repository paths.
docs_dir = "site-src"
site_dir = "site"
extra_css = [
  "docs/assets/gal-common.css",
  "docs/assets/gal-ongoing.css",
  "docs/assets/gal-papers.css",
  "docs/assets/gal-notes.css",
  "docs/stylesheets/site.css",
]
extra_javascript = [
  "docs/assets/gal-common.js",
  "docs/assets/gal-ongoing.js",
  "docs/assets/gal-papers.js",
  "docs/assets/gal-notes.js",
]
nav = [
  { "Home" = "README.md" },
  { "Getting started" = [
    { "Find your guide" = "docs/README.md" },
    { "Try the synthetic demo" = "examples/README.md" },
    { "Add CERN data" = "docs/cern-demo.md" },
  ] },
  { "Using the package" = [
    { "Data and registry" = "docs/data.md" },
    { "Choosing records" = "docs/selection.md" },
    { "Exploring pages" = "docs/pages.md" },
    { "Citations" = "docs/citations.md" },
    { "Group websites" = "docs/website.md" },
    { "Warnings and recovery" = "docs/problems.md" },
  ] },
  { "Reference" = [
    { "Commands and options" = "docs/cli-reference.md" },
    { "Curated data format" = "docs/curated-format.md" },
    { "Files, URLs and reports" = "docs/output-reference.md" },
    { "Python API" = "docs/python-access.md" },
    { "Compatibility" = "docs/compatibility.md" },
    { "Upgrading" = "docs/upgrading.md" },
    { "Release notes" = [
      { "v0.2.0" = "docs/release-notes/v0.2.0.md" },
      { "v0.1.0 (historical)" = "docs/release-notes/v0.1.0.md" },
    ] },
    { "Glossary" = "docs/glossary.md" },
  ] },
  { "Demo" = [
    { "Overview" = "examples/demo/index.md" },
    { "Ongoing analyses" = "examples/demo/ongoing.md" },
    { "Papers" = "examples/demo/papers.md" },
    { "Conference notes" = "examples/demo/confnotes.md" },
    { "Public notes" = "examples/demo/pubnotes.md" },
  ] },
  { "Contributing" = [
    { "Architecture" = "docs/architecture.md" },
    { "Field walkthrough" = "docs/contributing-field.md" },
    { "Development and testing" = "docs/development.md" },
    { "Documentation maintenance" = "docs/documentation.md" },
    { "Preparing releases" = "docs/releases.md" },
  ] },
]

[project.theme]
font = false
features = ["navigation.instant", "content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.validation]
invalid_links = true
invalid_link_anchors = true
