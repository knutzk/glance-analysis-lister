[project]
site_name = "GLANCE analysis lister · development"
site_description = "Analysis and publication pages from ATLAS GLANCE records"
site_url = "https://knutzk.github.io/glance-analysis-lister/"
repo_url = "https://github.com/knutzk/glance-analysis-lister"
# scripts/docs.py selects public inputs and preserves their repository paths.
docs_dir = "site-src"
site_dir = "site"
extra_css = [
  "docs/assets/gal-common.css",
  "docs/assets/gal-ongoing.css",
  "docs/assets/gal-papers.css",
  "docs/assets/gal-notes.css",
  "docs/stylesheets/site.css",
]
extra_javascript = [
  "docs/assets/gal-common.js",
  "docs/assets/gal-ongoing.js",
  "docs/assets/gal-papers.js",
  "docs/assets/gal-notes.js",
]
nav = [
  { "Home" = "README.md" },
  { "Documentation" = [
    { "Overview" = "docs/README.md" },
    { "Synthetic example" = "examples/README.md" },
    { "Commands and recovery" = "docs/workflows.md" },
    { "Command-line reference" = "docs/cli-reference.md" },
    { "Troubleshooting" = "docs/troubleshooting.md" },
    { "Rendering and policies" = "docs/rendering.md" },
    { "Ongoing analyses" = "docs/ongoing.md" },
    { "Publication tables" = "docs/publications.md" },
    { "Diagnostic reports" = "docs/diagnostics.md" },
    { "Curation and identifiers" = "docs/registry.md" },
    { "Curated v2 contract" = "docs/curated-format.md" },
    { "Citations" = "docs/citations.md" },
    { "Provenance" = "docs/provenance.md" },
    { "Python access" = "docs/python-access.md" },
    { "Compatibility" = "docs/compatibility.md" },
    { "Upgrading" = "docs/upgrading.md" },
    { "Glossary" = "docs/glossary.md" },
  ] },
  { "Demo" = [
    { "Overview" = "examples/demo/index.md" },
    { "Ongoing analyses" = "examples/demo/ongoing.md" },
    { "Papers" = "examples/demo/papers.md" },
    { "Conference notes" = "examples/demo/confnotes.md" },
    { "Public notes" = "examples/demo/pubnotes.md" },
  ] },
  { "Development" = [
    { "Architecture" = "docs/architecture.md" },
    { "Field walkthrough" = "docs/contributing-field.md" },
    { "Validation" = "docs/development.md" },
    { "Releases" = "docs/releases.md" },
    { "Release notes" = [
      { "v0.2.0" = "docs/release-notes/v0.2.0.md" },
      { "v0.1.0 (historical)" = "docs/release-notes/v0.1.0.md" },
    ] },
    { "Local documentation site" = "docs/site.md" },
    { "Screenshots" = "docs/images/README.md" },
  ] },
]

[project.theme]
font = false
features = ["navigation.instant", "content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.validation]
invalid_links = true
invalid_link_anchors = true
