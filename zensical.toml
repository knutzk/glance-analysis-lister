[project]
site_name = "GROVE · development"
site_description = "Analysis and publication pages from ATLAS GLANCE records"
site_url = "https://knutzk.github.io/glance-grove/"
repo_url = "https://github.com/knutzk/glance-grove"
# scripts/docs.py selects public inputs and preserves their repository paths.
docs_dir = "site-src"
site_dir = "site"
extra_css = [
  "docs/assets/grove-common.css",
  "docs/assets/grove-ongoing.css",
  "docs/assets/grove-papers.css",
  "docs/assets/grove-notes.css",
  "docs/stylesheets/site.css",
]
extra_javascript = [
  "docs/assets/grove-common.js",
  "docs/assets/grove-ongoing.js",
  "docs/assets/grove-papers.js",
  "docs/assets/grove-notes.js",
]
nav = [
  { "Home" = "README.md" },
  { "Getting started" = [
    { "Find your guide" = "docs/README.md" },
    { "Try the synthetic demo" = "examples/README.md" },
    { "Add CERN data" = "docs/cern-demo.md" },
  ] },
  { "Using the package" = [
    { "Data and registry" = "docs/data.md" },
    { "Choosing records" = "docs/selection.md" },
    { "Exploring pages" = "docs/pages.md" },
    { "Citations" = "docs/citations.md" },
    { "Group websites" = "docs/website.md" },
    { "Warnings and recovery" = "docs/problems.md" },
  ] },
  { "Reference" = [
    { "Commands and options" = "docs/cli-reference.md" },
    { "Saved data and generated files" = "docs/file-reference.md" },
    { "Using Python" = "docs/python-access.md" },
    { "Upgrading and compatibility" = "docs/upgrading.md" },
  ] },
  { "Demo" = [
    { "Overview" = "examples/demo/index.md" },
    { "Ongoing analyses" = "examples/demo/ongoing.md" },
    { "Papers" = "examples/demo/papers.md" },
    { "Conference notes" = "examples/demo/confnotes.md" },
    { "Public notes" = "examples/demo/pubnotes.md" },
  ] },
  { "Contributing" = "docs/contributing.md" },
]

[project.theme]
font = false
features = ["navigation.instant", "content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.validation]
invalid_links = true
invalid_link_anchors = true
