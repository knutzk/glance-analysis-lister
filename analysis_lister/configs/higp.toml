# Source: HIGP subgroup selection URL supplied from GLANCE.
# Select subgroup involvement, including analyses led by other groups.
# Individual selection URLs additionally supplied subgroups 826 and 827.
name = "HIGP"

[selection]
field = "subgroups"
operator = "contains"
values = [
    824, # (H)Harmonization
    825, # resonant multileptons
    826, # non-resonant multileptons
    827, # Taus | Leptons
    828, # b|c quarks
    831, # Higgs pairs
    830, # Tops
    829, # Photons
]
