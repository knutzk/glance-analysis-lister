# Only objective file areas belong here; maintainers assess semantic impact.
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - docs/**
          - examples/**/*.md
          - .github/PULL_REQUEST_TEMPLATE.md

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/labeler.yml
