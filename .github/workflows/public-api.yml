name: Public API advisory

on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: Explicit supported baseline tag or commit
        required: true
        type: string
      candidate:
        description: Candidate tag or commit (defaults to selected workflow revision)
        required: false
        type: string

permissions:
  contents: read

jobs:
  public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package dependencies
        run: python -m pip install .
      - name: Compare documented Python interfaces
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || inputs.baseline }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha || inputs.candidate || github.sha }}
        run: python scripts/check_public_api.py --base "$BASE_REVISION" --candidate "$CANDIDATE_REVISION" --output public-api-report
      - name: Save advisory comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-api-report
          path: public-api-report/
          if-no-files-found: warn
          retention-days: 14
