name: Prepare or publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub release tag (for example v0.4.0)
        required: true
        type: string
      publish:
        description: Upload to PyPI after validation (requires publishing enabled)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-publishing
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'knutzk/glance-grove' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'release' && github.event.action == 'published' &&
        !github.event.release.draft && !github.event.release.prerelease &&
        startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Use the maintained validator, including when backfilling older releases.
          # Distribution bytes still come exclusively from the selected release.
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check manual publication request
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          PUBLISHING_ENABLED: ${{ vars.PYPI_PUBLISHING_ENABLED }}
        run: |
          if [ "$PUBLISH_REQUESTED" = true ] && [ "$PUBLISHING_ENABLED" != true ]; then
            echo 'PyPI publishing is disabled. Explicitly enable it for an approved release.' >&2
            exit 1
          fi
      - name: Download and verify published release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: python scripts/prepare_pypi.py --tag "$RELEASE_TAG" --output dist
      - name: Validate PyPI metadata and description
        run: |
          python -m pip install 'twine>=6,<7'
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Report disabled publishing
        if: vars.PYPI_PUBLISHING_ENABLED != 'true'
        run: echo 'Validation completed; PyPI uploads are disabled.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: >-
      vars.PYPI_PUBLISHING_ENABLED == 'true' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Activation also requires the pypi environment to allow release tags.
    # Its required reviewer must be removed for uploads without a second approval.
    # Keep PYPI_PUBLISHING_ENABLED=false until activation is explicitly authorised.
    environment:
      name: pypi
      url: https://pypi.org/project/glance-grove/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
