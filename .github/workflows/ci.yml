name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only newer runs of the same PR supersede one another. Pushes and tags are unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Verify release tag and notes
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
          notes = Path(".github/release-notes") / f"{tag}.txt"
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit(f"Missing release notes: {notes}")
          PY
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check and record resolved dependencies
        run: |
          python -VV
          python -c 'import platform; print(platform.platform(), platform.machine())'
          python -m pip check
          python -m pip freeze
      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Run offline regression tests
        id: offline_tests
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s tests -v
      - name: Report offline Python coverage
        if: ${{ always() && steps.offline_tests.outcome != 'skipped' }}
        env:
          OFFLINE_TEST_OUTCOME: ${{ steps.offline_tests.outcome }}
        run: |
          python -m coverage combine
          python -m coverage report
          python -m coverage html
          python -m coverage xml
          python -m coverage json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          totals = json.loads(Path("coverage-report/coverage.json").read_text())["totals"]
          lines = totals["covered_lines"] / totals["num_statements"] * 100
          branches = totals["covered_branches"] / totals["num_branches"] * 100
          outcome = os.environ["OFFLINE_TEST_OUTCOME"]
          summary = (
              "### Offline Python coverage\n\n"
              f"Tests: **{outcome}**. Failed runs provide partial coverage only.\n\n"
              "| Measure | Coverage |\n| --- | --- |\n"
              f"| Lines | {lines:.2f}% ({totals['covered_lines']}/{totals['num_statements']}) |\n"
              f"| Branches | {branches:.2f}% ({totals['covered_branches']}/{totals['num_branches']}) |\n\n"
              "Scope: maintained `analysis_lister` Python, including child Python processes. "
              "Excludes experimental Events code, browser JavaScript, browser/site checks "
              "and live CERN access. No percentage gate is enforced.\n\n"
              "Download the **python-coverage** artifact for HTML, XML and JSON reports.\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write(summary)
          PY
      - name: Save Python coverage reports
        if: ${{ always() && steps.offline_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: |
            coverage-report/html/
            coverage-report/coverage.xml
            coverage-report/coverage.json
          if-no-files-found: error
          retention-days: 14
      # With no --wheel/--sdist flags, build creates the wheel from the sdist.
      - name: Build source distribution and rebuild wheel from it
        run: python -m build
      - name: Verify installed wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/package-check"
          "$RUNNER_TEMP/package-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/package-check/bin/python" -m pip check
          "$RUNNER_TEMP/package-check/bin/python" -I scripts/check_distribution.py
      - name: Save verified release distributions
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  browser:
    env:
      BROWSER_DIAGNOSTICS_DIR: ${{ github.workspace }}/browser-report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            tests/browser/requirements.txt
            requirements-docs.txt
      - name: Install browser and site test dependencies
        run: python -m pip install -r requirements-dev.txt -r tests/browser/requirements.txt
      - name: Record browser validation environment
        run: |
          mkdir -p "$BROWSER_DIAGNOSTICS_DIR"
          exec > >(tee "$BROWSER_DIAGNOSTICS_DIR/environment.log") 2>&1
          python -VV
          python -c 'import platform; print(platform.platform(), platform.machine())'
          python -m pip check
          python -m pip freeze
      - name: Select sandbox-compatible runner browsers
        shell: bash
        run: |
          exec > >(tee "$BROWSER_DIAGNOSTICS_DIR/browser-startup.log") 2>&1
          chrome=$(command -v google-chrome)
          driver=$(command -v chromedriver)
          chrome_version=$("$chrome" --product-version)
          driver_version=$("$driver" --version | cut -d ' ' -f 2)
          printf 'Chrome %s; ChromeDriver %s\n' "$chrome_version" "$driver_version"
          test "${chrome_version%.*}" = "${driver_version%.*}"
          printf 'CHROME_BINARY=%s\nCHROMEDRIVER=%s\n' "$chrome" "$driver" >> "$GITHUB_ENV"
          # Use the runner's installed Chrome with its Ubuntu sandbox policy.
          # Keep startup stderr visible if the browser cannot launch.
          timeout 30 "$chrome" --headless=new --no-first-run \
            --user-data-dir="$RUNNER_TEMP/chrome-smoke" --dump-dom about:blank
      - name: Check standalone views and Zensical integration
        run: |
          exec > >(tee "$BROWSER_DIAGNOSTICS_DIR/views.log") 2>&1
          python tests/browser/check_ongoing.py --driver "$CHROMEDRIVER"
          python tests/browser/check_papers.py --driver "$CHROMEDRIVER"
          python tests/browser/check_notes.py --resource confnotes --driver "$CHROMEDRIVER"
          python tests/browser/check_notes.py --resource pubnotes --driver "$CHROMEDRIVER"
          python tests/browser/check_zensical.py --driver "$CHROMEDRIVER"
      - name: Check the documented demo and policy tutorial
        shell: bash
        run: |
          python tests/browser/check_demo.py --driver "$CHROMEDRIVER" 2>&1 | tee "$BROWSER_DIAGNOSTICS_DIR/demo.log"
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-diagnostics
          path: browser-report/
          if-no-files-found: warn
          retention-days: 14

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Record documentation validation environment
        run: |
          python -VV
          python -c 'import platform; print(platform.platform(), platform.machine())'
          python -m pip check
          python -m pip freeze
      - name: Build public documentation with strict link checks
        run: python scripts/docs.py build
      - name: Save documentation for review
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, browser, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz \
            --verify-tag --draft --title "$RELEASE_TAG" \
            --notes-file ".github/release-notes/$RELEASE_TAG.txt"
