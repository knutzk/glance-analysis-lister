name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Verify release tag and notes
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
          notes = Path(".github/release-notes") / f"{tag}.txt"
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit(f"Missing release notes: {notes}")
          PY
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check and record resolved dependencies
        run: |
          python -m pip check
          python -m pip freeze
      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify installed wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/package-check"
          "$RUNNER_TEMP/package-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/package-check/bin/python" -m pip check
          "$RUNNER_TEMP/package-check/bin/python" -I scripts/check_distribution.py
      - name: Save verified release distributions
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz \
            --verify-tag --draft --title "$RELEASE_TAG" \
            --notes-file ".github/release-notes/$RELEASE_TAG.txt"
