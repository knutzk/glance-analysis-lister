name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check and record resolved dependencies
        run: |
          python -m pip check
          python -m pip freeze
      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify installed wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/package-check"
          "$RUNNER_TEMP/package-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/package-check/bin/python" -m pip check
          "$RUNNER_TEMP/package-check/bin/python" -I scripts/check_distribution.py
