[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glance-analysis-lister"
version = "0.1.0"
description = "Maintain ATLAS GLANCE analysis registries and render analysis pages"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENCE"]
authors = [{name = "Knut Zoch"}]
requires-python = ">=3.13"
dependencies = ["attrs>=26.1", "requests>=2.34", "stare==0.6.1"]

[project.urls]
Repository = "https://github.com/knutzk/glance-analysis-lister.git"

[project.optional-dependencies]
download = ["beautifulsoup4>=4.15", "selenium>=4.46"]
dev = ["beautifulsoup4>=4.15", "selenium>=4.46", "ruff==0.16.0", "build>=1.2"]

[project.scripts]
analysis-lister = "analysis_lister.cli:main"

[tool.setuptools.packages.find]
include = ["analysis_lister*"]

[tool.setuptools.package-data]
analysis_lister = ["_source_revision.txt", "certs/*.pem", "certs/README.md", "views/assets/*.js", "views/assets/*.css"]

[tool.setuptools.data-files]
"share/glance-analysis-lister" = ["json/doi_metadata.json", "json/pubnote_identifiers.json", "publication-curation.toml"]
