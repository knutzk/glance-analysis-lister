[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glance-grove"
version = "0.5.0"
description = "Maintain ATLAS GLANCE analysis registries and render analysis pages"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENCE"]
authors = [{name = "Knut Zoch"}]
requires-python = ">=3.13"
dependencies = ["attrs>=26.1", "jsonschema>=4.23,<5", "rfc3339-validator>=0.1.4", "requests>=2.34", "stare==0.7.0"]

[project.urls]
Repository = "https://github.com/knutzk/glance-grove.git"
Documentation = "https://knutzk.github.io/glance-grove/docs/"
Issues = "https://github.com/knutzk/glance-grove/issues"
Changelog = "https://github.com/knutzk/glance-grove/releases"

[project.optional-dependencies]
html = ["beautifulsoup4>=4.15", "selenium>=4.46"]
dev = ["beautifulsoup4>=4.15", "selenium>=4.46", "ruff==0.16.0", "build>=1.2", "coverage==7.17.2", "twine>=6,<7"]

[project.scripts]
grove = "grove.cli:main"

[tool.setuptools.packages.find]
include = ["grove*"]

[tool.setuptools.package-data]
grove = ["_source_revision.txt", "registry/schemas/*.json", "views/assets/*.js", "views/assets/*.css", "downloaders/certs/*.pem", "downloaders/certs/README.md"]

[tool.setuptools.data-files]
"share/glance-grove" = ["json/doi_metadata.json", "json/pubnote_identifiers.json", "publication-curation.toml", "ruff.toml"]

[tool.coverage.run]
branch = true
source = ["grove"]
relative_files = true
parallel = true
patch = ["subprocess"]
data_file = "coverage-report/.coverage"

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "coverage-report/html"

[tool.coverage.xml]
output = "coverage-report/coverage.xml"

[tool.coverage.json]
output = "coverage-report/coverage.json"
